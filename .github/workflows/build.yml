name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -n "$GOOGLE_SERVICES_JSON" ]; then
          mkdir -p app/src/standard
          echo "$GOOGLE_SERVICES_JSON" > app/src/standard/google-services.json
          echo "google-services.json created from GitHub Secret"
        elif [ -f "app/src/standard/google-services.json.dummy" ]; then
          cp app/src/standard/google-services.json.dummy app/src/standard/google-services.json
          echo "WARNING: Using dummy google-services.json, Firebase features disabled"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleStandardDebug --no-daemon --stacktrace

    - name: Build release APK
      run: ./gradlew assembleStandardRelease --no-daemon --stacktrace

    - name: Rename release APKs to standard naming
      run: |
        cd app/build/outputs/apk/standard/release
        for apk in *.apk; do
          # Rename from TachiyomiDNP-{version}-{buildType}-{abi}.apk
          # to TachiyomiDNP-{version}-release-{abi}.apk
          if [[ "$apk" != *"-release-"* ]]; then
            newname=$(echo "$apk" | sed 's/-standardRelease-/-release-/')
            mv "$apk" "$newname"
            echo "Renamed: $apk -> $newname"
          fi
        done
        ls -la *.apk

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/standard/debug/*.apk

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/standard/release/*.apk
