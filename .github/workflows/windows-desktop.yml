name: Windows Desktop

on:
  push:
    branches: [ main, develop, beta, 'feature/**' ]
    tags: [ v* ]
  pull_request:
    branches: [ main, beta ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Windows desktop application
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Windows desktop packaging attempt $attempt of $maxAttempts"
            & .\gradlew.bat :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              Write-Warning "Packaging failed with exit code $LASTEXITCODE. Retrying after 20 seconds..."
              Start-Sleep -Seconds 20
            }
          }

          exit $LASTEXITCODE

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: tachiyomidnp-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: tachiyomidnp-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
