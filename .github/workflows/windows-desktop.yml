name: Windows Desktop

on:
  push:
    branches: [ main, develop, beta, 'feature/**', 'phase2f-*', 'phase2g-*' ]
    tags: [ v* ]
  pull_request:
    branches: [ main, beta, 'phase2e-desktop-reader-clean', 'phase2f-reader-progress' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run desktop unit tests
        run: .\gradlew.bat :desktop:test --no-daemon --stacktrace

      - name: Build Windows desktop application
        shell: pwsh
        run: |
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Windows desktop packaging attempt $attempt of $maxAttempts"
            & .\gradlew.bat :desktop:packageDistributionForCurrentOS --no-daemon --stacktrace

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $maxAttempts) {
              Write-Warning "Packaging failed with exit code $LASTEXITCODE. Retrying after 20 seconds..."
              Start-Sleep -Seconds 20
            }
          }

          exit $LASTEXITCODE

      - name: Verify packaged Java runtime matches Java 21 bytecode
        shell: pwsh
        run: |
          # Compose Desktop may place the distributable runtime outside the installer output folder.
          # Search the whole desktop build tree and identify release metadata by its parent folder.
          $runtimeRelease = Get-ChildItem "desktop/build" -Filter "release" -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "runtime" } |
            Select-Object -First 1

          if ($null -eq $runtimeRelease) {
            Write-Host "Release metadata files found under desktop/build:"
            Get-ChildItem "desktop/build" -Filter "release" -File -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host $_.FullName }
            Write-Host "Compose build directories:"
            Get-ChildItem "desktop/build/compose" -Directory -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "Could not locate bundled runtime/release under desktop/build. Refusing to publish an unverified installer."
          }

          $releaseText = Get-Content -LiteralPath $runtimeRelease.FullName -Raw
          Write-Host "Bundled runtime metadata: $($runtimeRelease.FullName)"
          Write-Host $releaseText

          if ($releaseText -notmatch 'JAVA_VERSION="21(?:\.|")') {
            throw "Bundled runtime is not Java 21. The desktop bytecode targets Java 21, so this installer would fail at startup."
          }

          $mainClass = "desktop/build/classes/kotlin/main/eu/kanade/tachiyomi/desktop/MainKt.class"
          if (-not (Test-Path -LiteralPath $mainClass)) {
            throw "Could not find compiled MainKt.class at $mainClass"
          }

          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $mainClass))
          if ($bytes.Length -lt 8 -or $bytes[0] -ne 0xCA -or $bytes[1] -ne 0xFE -or $bytes[2] -ne 0xBA -or $bytes[3] -ne 0xBE) {
            throw "MainKt.class has an invalid Java class-file header."
          }

          $major = ([int]$bytes[6] * 256) + [int]$bytes[7]
          Write-Host "MainKt.class bytecode major version: $major"
          if ($major -ne 65) {
            throw "Expected Java 21 bytecode (major version 65), got $major."
          }

          Write-Host "Runtime and bytecode compatibility check passed."

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: tachiyomidnp-windows-exe
          path: desktop/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: tachiyomidnp-windows-msi
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
